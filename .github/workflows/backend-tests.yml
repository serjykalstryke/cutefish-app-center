name: Backend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    container: debian:13
    steps:
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git python3 python3-gi libpackagekit-glib2-18 dbus
      - uses: actions/checkout@v4
      - name: Backend regression tests
        run: python3 tests/test_backend.py -v
      - name: Private PackageKit protocol tests
        run: dbus-run-session -- python3 tests/test_packagekit_protocol.py -v
